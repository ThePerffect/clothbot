<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Гардероб</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="screen" class="screen"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="looks" class="active"><span class="ti">✦</span><span>Образы</span></button>
    <button data-tab="wardrobe"><span class="ti">◫</span><span>Гардероб</span></button>
    <button class="tab-add" id="addBtn" aria-label="Добавить вещь"><span>+</span></button>
    <button data-tab="laundry"><span class="ti">◌</span><span>Стирка</span><i class="badge" id="laundryBadge" hidden></i></button>
    <button data-tab="profile"><span class="ti">◍</span><span>Профиль</span></button>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>

  <script src="app.js"></script>
</body>
</html>
